name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pin actions to commit SHAs before the first release (OpenSSF Scorecard); Dependabot keeps them current.
      - uses: actions/checkout@v4
        with:
          path: weft-sim
          persist-credentials: false
      # weft-parts is a path dependency (../weft-parts) so model changes are tested together.
      - uses: actions/checkout@v4
        with:
          repository: theweft/weft-parts
          path: weft-parts
          persist-credentials: false
      # GitHub's Linux runners have KVM, but /dev/kvm is not accessible to the runner user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
      # Same pinned environment as local development; ends with booting the guest.
      - run: nix develop --command just ci
        working-directory: weft-sim
