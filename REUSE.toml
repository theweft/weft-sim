# REUSE (https://reuse.software): licence and copyright for every file in this repository.
# Source files additionally carry SPDX headers; with "closest", a file's own header wins.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The weft authors"
SPDX-License-Identifier = "MIT"

# The kernel module is dual licensed so it can be built into, or upstreamed to, Linux (GPL-2.0).
[[annotations]]
path = "module/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The weft authors"
SPDX-License-Identifier = "MIT OR GPL-2.0-only"
